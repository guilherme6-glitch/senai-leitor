<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUNDO SENAI • RASTREIO TI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Biblioteca do Leitor de QR Code / Câmara -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center p-3 sm:p-5">

  <!-- CARD PRINCIPAL DO LEITOR -->
  <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-5 sm:p-6 border border-slate-200">
    
    <!-- Título do Topo -->
    <div class="text-center pb-3 border-b-2 border-blue-900 mb-4">
      <h1 class="text-lg font-black text-blue-900 tracking-wide">
        MUNDO SENAI • RASTREIO TI
      </h1>
    </div>

    <!-- 1. Campo de Identificação do Funcionário (Bloqueado) -->
    <div class="mb-4">
      <div id="badge-funcionario" class="bg-emerald-100 border border-emerald-200 rounded-xl p-3 text-center text-emerald-900 font-bold text-xs sm:text-sm flex items-center justify-center gap-2">
        <i data-lucide="user" class="w-4 h-4 text-emerald-800"></i>
        <span id="txt-funcionario">Identificando funcionário pela URL...</span>
      </div>
    </div>

    <!-- 2. Local de Destino / Uso (Editável) -->
    <div class="mb-4">
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
        Local de Destino / Uso:
      </label>
      <select id="select-local" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm bg-white font-medium text-slate-700">
        <option value="">-- Não Definido / Nenhum (Opcional) --</option>
      </select>
    </div>

    <!-- 3. Escolha de Operação -->
    <div class="mb-4 space-y-2">
      <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
        Escolha de Operação:
      </label>
      
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="btn-modo-retirada" onclick="alternarModoOperacao('Retirada')"
          class="py-3 px-2 bg-red-500 hover:bg-red-600 text-white font-extrabold rounded-xl shadow transition flex items-center justify-center gap-1.5 text-sm">
          <i data-lucide="arrow-down-circle" class="w-4 h-4"></i>
          <span>Retirada</span>
        </button>

        <button type="button" id="btn-modo-devolucao" onclick="alternarModoOperacao('Devolução')"
          class="py-3 px-2 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold rounded-xl shadow transition flex items-center justify-center gap-1.5 text-sm">
          <i data-lucide="arrow-up-circle" class="w-4 h-4"></i>
          <span>Devolução</span>
        </button>
      </div>
    </div>

    <!-- 4. ÁREA DA CÂMERA EMBUTIDA (INLINE, SEM MODAL) -->
    <div id="section-camera" class="hidden mb-4 border-2 border-dashed border-slate-300 rounded-2xl p-2 bg-slate-50">
      <div class="flex items-center justify-between mb-2 px-1">
        <span id="label-modo-camera" class="text-xs font-bold px-2.5 py-1 rounded-full text-white bg-red-500">
          Lendo para Retirada
        </span>
        <button type="button" onclick="pararCamera()" class="text-xs font-bold text-slate-500 hover:text-red-600 flex items-center gap-1">
          <i data-lucide="camera-off" class="w-3.5 h-3.5"></i>
          <span>Fechar Câmera</span>
        </button>
      </div>

      <!-- Container do Leitor de Vídeo -->
      <div id="reader" class="w-full rounded-xl overflow-hidden border border-slate-200 bg-black min-h-[200px]"></div>
    </div>

    <!-- Mensagem de Feedback/Status das Leituras -->
    <div id="feedback-msg" class="hidden p-2.5 rounded-xl text-xs font-bold text-center mb-3"></div>

    <!-- 5. Lista de Ferramentas Bipadas (Sempre visível abaixo da câmera) -->
    <div class="mb-5">
      <div class="flex items-center justify-between mb-2">
        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">
          Ferramentas Bipadas (<span id="count-bipadas">0</span>):
        </label>
        <button type="button" onclick="limparLista()" id="btn-limpar" class="hidden text-[11px] text-red-600 hover:underline font-semibold">
          Limpar todas
        </button>
      </div>

      <div id="container-bipadas" class="min-h-[55px] p-2.5 rounded-xl border border-slate-200 bg-slate-50 flex flex-col gap-2 max-h-52 overflow-y-auto">
        <p id="msg-empty" class="text-xs text-slate-400 text-center py-2">
          Nenhuma ferramenta bipada ainda.
        </p>
      </div>
    </div>

    <!-- 6. Botão de Confirmação -->
    <button type="button" id="btn-confirmar" onclick="confirmarRegistros()"
      class="w-full py-3.5 bg-blue-900 hover:bg-blue-800 active:bg-blue-950 text-white font-extrabold rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-base disabled:opacity-50 disabled:cursor-not-allowed">
      <i data-lucide="check-circle" class="w-5 h-5"></i>
      <span>Confirmar Registros</span>
    </button>

  </div>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    // Configuração do Supabase Client
    const SUPABASE_URL = "https://gfxctmjgcbgxsrquugrt.supabase.co"; // Substitua pela sua URL
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdmeGN0bWpnY2JneHNycXV1Z3J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMjI4NzgsImV4cCI6MjEwODU5ODg3OH0.gvwfxHzgVF72epEMMTdBdRvovmgbtMHquYCFyFa2Li0";            // Substitua pela sua Key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Estado da Aplicação
    let funcionarioAtual = null;
    let listaFerramentasBipadas = [];
    let html5QrcodeScanner = null;
    let modoOperacaoAtual = 'Retirada';
    
    // Controles de trava para evitar leitura dupla
    let isProcessingScan = false;
    let ultimoCodigoLido = null;
    let tempoUltimaLeitura = 0;

    // Helper para verificar se a string é um UUID válido
    function isUUID(str) {
      const regex = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
      return regex.test(str);
    }

    // Inicialização ao carregar
    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      await carregarFuncionarioURL();
      await carregarLocaisDropdown();
    });

    // 1. CARREGAR FUNCIONÁRIO PELA URL (Trata UUID e Matrícula)
    async function carregarFuncionarioURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const funcId = urlParams.get('funcionario') || urlParams.get('id') || urlParams.get('matricula');
      const txtFunc = document.getElementById('txt-funcionario');
      const badgeFunc = document.getElementById('badge-funcionario');

      if (!funcId) {
        txtFunc.innerText = "❌ Nenhum funcionário informado na URL!";
        badgeFunc.className = "bg-red-100 border border-red-200 rounded-xl p-3 text-center text-red-800 font-bold text-xs sm:text-sm flex items-center justify-center gap-2";
        return;
      }

      try {
        let query = supabaseClient.from('funcionarios').select('id, matricula, nome, local_nome');

        // Se for um UUID válido, pesquisa pela chave id. Caso contrário, consulta pelo campo matricula
        if (isUUID(funcId)) {
          query = query.eq('id', funcId);
        } else {
          query = query.eq('matricula', funcId);
        }

        const { data: funcionario, error } = await query.maybeSingle();

        if (error) throw error;

        if (!funcionario) {
          txtFunc.innerText = `❌ Funcionário [${funcId}] não foi encontrado!`;
          badgeFunc.className = "bg-red-100 border border-red-200 rounded-xl p-3 text-center text-red-800 font-bold text-xs sm:text-sm flex items-center justify-center gap-2";
          return;
        }

        funcionarioAtual = funcionario;
        const codExibicao = funcionario.matricula || funcionario.id;
        txtFunc.innerText = `[${codExibicao}] - ${funcionario.nome}`;

        if (funcionario.local_nome) {
          document.getElementById('select-local').value = funcionario.local_nome;
        }
      } catch (err) {
        txtFunc.innerText = "Erro ao carregar funcionário: " + err.message;
        badgeFunc.className = "bg-red-100 border border-red-200 rounded-xl p-3 text-center text-red-800 font-bold text-xs sm:text-sm flex items-center justify-center gap-2";
      }
    }

    // 2. CARREGAR LOCAIS NO SELETOR
    async function carregarLocaisDropdown() {
      try {
        const { data: locais, error } = await supabaseClient
          .from('locais')
          .select('nome')
          .order('nome');

        if (error) throw error;

        const select = document.getElementById('select-local');
        locais.forEach(loc => {
          const opt = document.createElement('option');
          opt.value = loc.nome;
          opt.innerText = loc.nome;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error("Erro ao carregar locais:", err.message);
      }
    }

    // 3. ATIVAR MODO DE OPERAÇÃO E ABRIR CÂMERA EMBUTIDA
    async function alternarModoOperacao(acao) {
      modoOperacaoAtual = acao;

      const labelCam = document.getElementById('label-modo-camera');
      labelCam.innerText = `Lendo para ${acao}`;
      labelCam.className = acao === 'Retirada' 
        ? 'text-xs font-bold px-2.5 py-1 rounded-full text-white bg-red-500'
        : 'text-xs font-bold px-2.5 py-1 rounded-full text-white bg-emerald-500';

      document.getElementById('section-camera').classList.remove('hidden');

      if (!html5QrcodeScanner) {
        html5QrcodeScanner = new Html5Qrcode("reader");
      } else if (html5QrcodeScanner.isScanning) {
        await html5QrcodeScanner.stop();
      }

      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 200, height: 200 } },
        onScanSuccess
      ).catch(err => {
        exibirFeedback("Erro ao acessar a câmara: " + err, "error");
      });
    }

    // Parar Câmera
    async function pararCamera() {
      if (html5QrcodeScanner && html5QrcodeScanner.isScanning) {
        await html5QrcodeScanner.stop();
      }
      document.getElementById('section-camera').classList.add('hidden');
    }

    // 4. PROCESSAR LEITURA DO QR CODE (Com Prevenção de Duplicatas)
    async function onScanSuccess(decodedText) {
      const idFerramenta = decodedText.trim();
      const agora = Date.now();

      // Ignora se estiver a processar uma leitura anterior ou se leu o mesmo código há menos de 2 segundos
      if (isProcessingScan || (idFerramenta === ultimoCodigoLido && (agora - tempoUltimaLeitura) < 2000)) {
        return;
      }

      // Verifica se o item já está na lista local
      if (listaFerramentasBipadas.some(item => item.id === idFerramenta)) {
        exibirFeedback(`⚠️ Ferramenta "${idFerramenta}" já está na lista!`, "warning");
        ultimoCodigoLido = idFerramenta;
        tempoUltimaLeitura = agora;
        return;
      }

      isProcessingScan = true;
      ultimoCodigoLido = idFerramenta;
      tempoUltimaLeitura = agora;

      try {
        // Valida no Supabase se a ferramenta existe
        const { data: ferramenta, error } = await supabaseClient
          .from('ferramentas')
          .select('id, nome')
          .eq('id', idFerramenta)
          .maybeSingle();

        if (error) throw error;

        if (!ferramenta) {
          exibirFeedback(`❌ Ferramenta "${idFerramenta}" não cadastrada!`, "error");
          return;
        }

        // Adiciona à lista
        listaFerramentasBipadas.push({
          id: ferramenta.id,
          nome: ferramenta.nome,
          acao: modoOperacaoAtual
        });

        atualizarInterfaceBipadas();
        exibirFeedback(`✅ "${ferramenta.nome}" adicionada!`, "success");

      } catch (err) {
        exibirFeedback("Erro ao validar QR Code: " + err.message, "error");
      } finally {
        isProcessingScan = false;
      }
    }

    // 5. ATUALIZAR LISTA DE FERRAMENTAS BIPADAS
    function atualizarInterfaceBipadas() {
      const container = document.getElementById('container-bipadas');
      const countLabel = document.getElementById('count-bipadas');
      const btnLimpar = document.getElementById('btn-limpar');

      countLabel.innerText = listaFerramentasBipadas.length;

      if (listaFerramentasBipadas.length === 0) {
        container.innerHTML = '<p id="msg-empty" class="text-xs text-slate-400 text-center py-2">Nenhuma ferramenta bipada ainda.</p>';
        btnLimpar.classList.add('hidden');
        return;
      }

      btnLimpar.classList.remove('hidden');

      container.innerHTML = listaFerramentasBipadas.map((item, index) => `
        <div class="bg-white p-2 rounded-lg border border-slate-200 flex items-center justify-between shadow-sm">
          <div class="flex items-center gap-2 overflow-hidden">
            <span class="px-2 py-0.5 rounded text-[10px] font-bold text-white ${item.acao === 'Retirada' ? 'bg-red-500' : 'bg-emerald-500'}">
              ${item.acao}
            </span>
            <span class="text-xs font-bold text-slate-800 truncate">${item.id} - ${item.nome}</span>
          </div>
          <button type="button" onclick="removerItemBipado(${index})" class="text-slate-400 hover:text-red-500 p-1">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function removerItemBipado(index) {
      listaFerramentasBipadas.splice(index, 1);
      atualizarInterfaceBipadas();
    }

    function limparLista() {
      listaFerramentasBipadas = [];
      atualizarInterfaceBipadas();
    }

    // 6. ENVIAR REGISTROS AO SUPABASE
    async function confirmarRegistros() {
      if (!funcionarioAtual) {
        alert("Não é possível registrar: funcionário não foi identificado!");
        return;
      }

      if (listaFerramentasBipadas.length === 0) {
        alert("Escaneie ao menos uma ferramenta antes de confirmar!");
        return;
      }

      const localSelecionado = document.getElementById('select-local').value || funcionarioAtual.local_nome || 'Não Especificado';
      const btn = document.getElementById('btn-confirmar');

      btn.disabled = true;
      btn.innerHTML = '<span>Processando...</span>';

      try {
        for (const item of listaFerramentasBipadas) {
          const novoStatus = (item.acao === 'Retirada') ? 'Emprestado' : 'Disponível';
          const comQuem = (item.acao === 'Retirada') ? funcionarioAtual.nome : null;

          // 1. Atualiza status da ferramenta
          const { error: errFerramenta } = await supabaseClient
            .from('ferramentas')
            .update({
              status: novoStatus,
              com_quem_esta: comQuem,
              local_atual: localSelecionado,
              desde: new Date().toISOString()
            })
            .eq('id', item.id);

          if (errFerramenta) throw errFerramenta;

          // 2. Insere registro no histórico
          const { error: errHist } = await supabaseClient
            .from('historico')
            .insert([{
              id_ferramenta: item.id,
              nome_ferramenta: item.nome,
              funcionario_id: funcionarioAtual.id,
              nome_funcionario: funcionarioAtual.nome,
              local_uso: localSelecionado,
              acao: item.acao
            }]);

          if (errHist) throw errHist;
        }

        exibirFeedback("✅ Registrado com sucesso!", "success");
        limparLista();
        await pararCamera();

      } catch (err) {
        exibirFeedback("❌ Erro ao registrar: " + err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i><span>Confirmar Registros</span>';
        lucide.createIcons();
      }
    }

    // Exibição de Mensagens de Alerta
    function exibirFeedback(texto, tipo) {
      const msg = document.getElementById('feedback-msg');
      msg.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800', 'bg-amber-100', 'text-amber-800');

      if (tipo === 'success') {
        msg.classList.add('bg-green-100', 'text-green-800');
      } else if (tipo === 'error') {
        msg.classList.add('bg-red-100', 'text-red-800');
      } else {
        msg.classList.add('bg-amber-100', 'text-amber-800');
      }

      msg.innerText = texto;
      setTimeout(() => msg.classList.add('hidden'), 3500);
    }
  </script>
</body>
</html>
