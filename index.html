<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENAI | Leitor de Ferramentas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- Cabeçalho -->
  <header class="bg-slate-900 text-white p-4 border-b-4 border-red-600 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wider text-red-500">SENAI <span class="text-white text-base font-normal">| Leitor QR</span></h1>
      <span class="text-xs bg-green-500/20 text-green-400 px-2 py-1 rounded-full font-mono">● Online</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Área do Câmera / QR Code -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="font-semibold text-slate-700 mb-2 text-center">1. Escanear QR Code da Ferramenta</h2>
      <div id="reader" class="overflow-hidden rounded-lg border-2 border-dashed border-slate-300"></div>
      <p id="qr-result" class="text-xs text-center text-slate-500 mt-2">Aponte a câmera para o QR Code</p>
    </div>

    <!-- Formulário de Registro -->
    <form id="form-registro" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="font-semibold text-slate-700 border-b pb-2">2. Dados da Movimentação</h2>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ID da Ferramenta</label>
        <input type="text" id="id_ferramenta" required readonly placeholder="Aguardando bipagem..." 
               class="w-full bg-slate-100 border border-slate-300 rounded-lg p-2.5 text-sm font-mono font-bold text-slate-700">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Nome da Ferramenta</label>
        <input type="text" id="nome_ferramenta" required placeholder="Ex: Multímetro Digital" 
               class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Funcionário</label>
        <input type="text" id="nome_funcionario" required placeholder="Ex: Ana Beatriz Souza" 
               class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Local de Uso / Setor</label>
        <input type="text" id="local_uso" required placeholder="Ex: Oficina de Mecânica" 
               class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Ação</label>
        <select id="acao" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm font-semibold focus:ring-2 focus:ring-red-500 outline-none">
          <option value="Retirada">🔴 Retirada (Empréstimo)</option>
          <option value="Devolução">🟢 Devolução</option>
        </select>
      </div>

      <button type="submit" id="btn-submit" 
              class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow transition-all duration-200">
        Confirmar e Registrar
      </button>
    </form>

    <!-- Feedback Mensagem -->
    <div id="mensagem" class="hidden p-4 rounded-lg text-center text-sm font-semibold"></div>

  </main>

  <script>
    
// Configurações do Supabase
const SUPABASE_URL = "https://gfxctmjgcbgsrrquugrt.supabase.co";
const SUPABASE_KEY = "sb_publishable_wPwhZsmoK_qpJjSi5TrZuQ_kD0b1KJr";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Inicialização da Câmera QR Code
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 200, height: 200 } },
      (decodedText) => {
        document.getElementById('id_ferramenta').value = decodedText;
        document.getElementById('qr-result').innerText = `✅ QR Code Lido: ${decodedText}`;
      },
      (errorMessage) => {}
    ).catch(err => {
      document.getElementById('reader').innerText = "Câmera não permitida ou indisponível.";
    });

    // Envio do Formulário para o Supabase
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const msg = document.getElementById('mensagem');

      btn.disabled = true;
      btn.innerText = "Registrando...";

      const idFerramenta = document.getElementById('id_ferramenta').value;
      const nomeFerramenta = document.getElementById('nome_ferramenta').value;
      const funcionario = document.getElementById('nome_funcionario').value;
      const local = document.getElementById('local_uso').value;
      const acao = document.getElementById('acao').value;

      try {
        // 1. Inserir no Histórico
        const { error: errHist } = await supabaseClient.from('historico').insert([{
          id_ferramenta: idFerramenta,
          nome_ferramenta: nomeFerramenta,
          nome_funcionario: funcionario,
          local_uso: local,
          acao: acao
        }]);

        if (errHist) throw errHist;

        // 2. Atualizar tabela de Ferramentas
        const novoStatus = (acao === 'Retirada') ? 'Emprestado' : 'Disponível';
        const comQuem = (acao === 'Retirada') ? funcionario : null;

        await supabaseClient.from('ferramentas').upsert([{
          id: idFerramenta,
          nome: nomeFerramenta,
          local_padrao: local,
          local_atual: local,
          status: novoStatus,
          com_quem_esta: comQuem,
          desde: new Date().toISOString()
        }]);

        msg.className = "p-4 rounded-lg text-center text-sm font-semibold bg-green-100 text-green-800 block";
        msg.innerText = "✅ Movimentação registrada com sucesso!";
        document.getElementById('form-registro').reset();
      } catch (err) {
        msg.className = "p-4 rounded-lg text-center text-sm font-semibold bg-red-100 text-red-800 block";
        msg.innerText = "❌ Erro ao registrar: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Confirmar e Registrar";
      }
    });
  </script>
</body>
</html>
